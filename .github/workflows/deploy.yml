name: Deploy Vision Visa Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build

      # TEMPORARY GITHUB PAGES FIX ONLY
      # This changes the generated /out files.
      # It does NOT change your actual source files.
      - name: Fix paths for GitHub Pages demo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("out")
          prefix = "/visionvisa-demo"

          def fix_path(path):
              if not path:
                  return path

              # Already correctly prefixed
              if path == prefix or path.startswith(prefix + "/"):
                  return path

              # Absolute local path
              if path.startswith("/"):
                  return prefix + path

              # Relative public assets
              if path.startswith("images/"):
                  return prefix + "/" + path

              if path.startswith("icons/"):
                  return prefix + "/" + path

              if path.startswith("fonts/"):
                  return prefix + "/" + path

              if path.startswith("js/"):
                  return prefix + "/" + path

              if path.startswith("css/"):
                  return prefix + "/" + path

              return path

          # -----------------------------------------
          # Fix HTML href/src attributes
          # -----------------------------------------
          for file in root.rglob("*.html"):
              text = file.read_text(encoding="utf-8")

              def replace_attr(match):
                  attr = match.group(1)
                  quote = match.group(2)
                  value = match.group(3)

                  value = fix_path(value)

                  return f'{attr}={quote}{value}{quote}'

              text = re.sub(
                  r'(href|src)=(["\'])(.*?)\2',
                  replace_attr,
                  text
              )

              # -----------------------------------------
              # Fix CSS url(...)
              # Handles both:
              # url(/images/...)
              # url(images/...)
              # -----------------------------------------
              def replace_css_url(match):
                  quote = match.group(1) or ""
                  path = match.group(2)

                  fixed = fix_path(path)

                  return f'url({quote}{fixed}{quote})'

              text = re.sub(
                  r'url\((["\']?)(?!data:|https?:|//)([^)"\']+)\1\)',
                  replace_css_url,
                  text
              )

              file.write_text(text, encoding="utf-8")

          # -----------------------------------------
          # Fix standalone CSS files
          # -----------------------------------------
          for file in root.rglob("*.css"):
              text = file.read_text(encoding="utf-8")

              def replace_css_url(match):
                  quote = match.group(1) or ""
                  path = match.group(2)

                  fixed = fix_path(path)

                  return f'url({quote}{fixed}{quote})'

              text = re.sub(
                  r'url\((["\']?)(?!data:|https?:|//)([^)"\']+)\1\)',
                  replace_css_url,
                  text
              )

              file.write_text(text, encoding="utf-8")

          print("GitHub Pages paths fixed successfully.")
          PY

      # Verify important pages actually exist before deployment
      - name: Verify generated pages
        shell: bash
        run: |
          echo "Checking generated pages..."

          test -f out/index.html
          test -f out/visas/index.html
          test -f out/forex/index.html
          test -f out/contact/index.html
          test -f out/about/index.html
          test -f out/travel-insurance/index.html
          test -f out/air-tickets/index.html
          test -f out/apply-now/index.html

          echo "All main pages exist."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4