name: Deploy Vision Visa Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build

      # TEMPORARY GITHUB PAGES FIX ONLY
      # This changes the generated /out files.
      # It does NOT change your actual source files.
      - name: Fix paths for GitHub Pages demo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("out")
          prefix = "/visionvisa-demo"

          if not root.exists():
              raise SystemExit("ERROR: out folder was not created by Next.js build.")

          def fix_path(value):
              if not value.startswith("/"):
                  return value

              if value.startswith("//"):
                  return value

              if value == prefix or value.startswith(prefix + "/"):
                  return value

              return prefix + value

          # Fix href/src in generated HTML
          for file in root.rglob("*.html"):
              text = file.read_text(encoding="utf-8")

              def replace_attr(match):
                  attr = match.group(1)
                  quote = match.group(2)
                  value = match.group(3)

                  value = fix_path(value)

                  return f"{attr}={quote}{value}{quote}"

              text = re.sub(
                  r'(href|src)=(["\'])(.*?)\2',
                  replace_attr,
                  text
              )

              # Fix CSS url(...) inside HTML
              text = re.sub(
                  r'url\((["\']?)/(?!/|visionvisa-demo/)',
                  lambda m: f'url({m.group(1)}{prefix}/',
                  text
              )

              file.write_text(text, encoding="utf-8")

          # Fix root-relative assets inside generated CSS
          for file in root.rglob("*.css"):
              text = file.read_text(encoding="utf-8")

              text = re.sub(
                  r'url\((["\']?)/(?!/|visionvisa-demo/)',
                  lambda m: f'url({m.group(1)}{prefix}/',
                  text
              )

              file.write_text(text, encoding="utf-8")

          print("Temporary GitHub Pages path fix completed.")
          PY

      # Verify important pages actually exist before deployment
      - name: Verify generated pages
        shell: bash
        run: |
          echo "Checking generated pages..."

          test -f out/index.html
          test -f out/visas/index.html
          test -f out/forex/index.html
          test -f out/contact/index.html
          test -f out/about/index.html
          test -f out/travel-insurance/index.html
          test -f out/air-tickets/index.html
          test -f out/apply-now/index.html

          echo "All main pages exist."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4