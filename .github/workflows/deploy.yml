name: Deploy Vision Visa Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build

      - name: Fix paths for GitHub Pages demo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("out")
          prefix = "/visionvisa-demo"

          def fix_path(path):
              if not path.startswith("/"):
                  return path

              if path.startswith("//"):
                  return path

              if path.startswith(prefix + "/") or path == prefix:
                  return path

              return prefix + path

          # Fix HTML files
          for file in root.rglob("*.html"):
              text = file.read_text(encoding="utf-8")

              def replace_attr(match):
                  attr = match.group(1)
                  quote = match.group(2)
                  value = match.group(3)

                  if value.startswith("/"):
                      value = fix_path(value)

                  return f"{attr}={quote}{value}{quote}"

              text = re.sub(
                  r'(href|src)=(["\'])(.*?)\2',
                  replace_attr,
                  text
              )

              # Fix inline CSS url(...)
              text = re.sub(
                  r'url\((["\']?)/(?!/)',
                  lambda m: f'url({m.group(1)}{prefix}/',
                  text
              )

              file.write_text(text, encoding="utf-8")

          # Fix CSS files
          for file in root.rglob("*.css"):
              text = file.read_text(encoding="utf-8")

              text = re.sub(
                  r'url\((["\']?)/(?!/)',
                  lambda m: f'url({m.group(1)}{prefix}/',
                  text
              )

              file.write_text(text, encoding="utf-8")

          print("GitHub Pages paths fixed successfully.")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4